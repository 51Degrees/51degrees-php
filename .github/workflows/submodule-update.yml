name: Submodule Update

on:
  workflow_dispatch:
    inputs:
      dryrun:
        type: boolean
        default: false

jobs:
  SubmoduleUpdate:
    name: Submodule Update
    uses: 51Degrees/common-ci/.github/workflows/nightly-submodule-update.yml@6f756057e5252a27df60d7722dc036f5bebd4369
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun || false }}
    secrets: inherit
