name: Temporary SWIG wrapper generation

# Temporary. Generates the IP Intelligence SWIG wrapper for the move of cxx
# to 4.5.101, commits it to this branch, and is then deleted from the branch.

on:
  push:
    branches:
      - 'feature/cxx-4.5.101'

permissions:
  contents: write

env:
  SWIG_TAG: v4.5.1
  SWIG_COMMIT: 88649f559942c29a228fa783dd01581e217bcb20
  CXX_OLD: 4110d6813e167a803a06489318b33b83a230fa32
  CXX_NEW: 4e023aaa5c1f5ec56d475c75a91761d8ef55dc20
  MODULE: FiftyOneDegreesIpIntelligenceEngine

defaults:
  run:
    shell: bash

jobs:
  Generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out with submodules
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Check the starting point
        run: |
          set -euo pipefail
          git log -1 --format='%H %s'
          git submodule status
          test "$(git -C cxx rev-parse HEAD)" = "$CXX_OLD"
          echo "SWIG already on the image, for reference only"
          which -a swig || true
          swig -version || true

      - name: Build SWIG from its tag
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison libpcre2-dev
          git clone --depth 1 --branch "$SWIG_TAG" \
            https://github.com/swig/swig.git "$RUNNER_TEMP/swig-src"
          test "$(git -C "$RUNNER_TEMP/swig-src" rev-parse HEAD)" = "$SWIG_COMMIT"
          cd "$RUNNER_TEMP/swig-src"
          ./autogen.sh
          ./configure --prefix="$RUNNER_TEMP/swig"
          make -j"$(nproc)"
          make install
          echo "SWIG_BIN=$RUNNER_TEMP/swig/bin/swig" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/artifact"
          "$RUNNER_TEMP/swig/bin/swig" -version \
            | tee "$RUNNER_TEMP/artifact/swig-version.txt"

      - name: Generate at 4110d681 into a separate folder and compare
        id: old
        run: |
          set -euo pipefail
          committed="$GITHUB_WORKSPACE/ip-intelligence/on-premise/src/php8"
          work="$RUNNER_TEMP/old/on-premise"
          mkdir -p "$RUNNER_TEMP/old"
          cp -R ip-intelligence/on-premise "$work"
          cd "$work"
          rm -rf cxx src/php8
          mkdir -p cxx src/php8
          cp -R "$GITHUB_WORKSPACE/cxx/src" cxx/src
          find . -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/old-before.txt"
          set -x
          "$SWIG_BIN" -c++ -php -module "$MODULE" \
            -outdir src/php8 -o src/php8/ipi_wrap.cxx ipi-php.i
          set +x
          find . -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/old-after.txt"
          echo "Files SWIG wrote:"
          diff "$RUNNER_TEMP/old-before.txt" "$RUNNER_TEMP/old-after.txt" \
            | tee "$RUNNER_TEMP/artifact/files-written-4110d681.txt" || true
          mkdir -p "$RUNNER_TEMP/artifact/out-4110d681"
          cp src/php8/* "$RUNNER_TEMP/artifact/out-4110d681/"
          echo "Committed:"
          (cd "$committed" && sha256sum * | tee "$RUNNER_TEMP/committed.sha")
          echo "Generated at 4110d681:"
          (cd src/php8 && sha256sum * | tee "$RUNNER_TEMP/generated.sha")
          for f in "$committed"/*; do
            cmp "$f" "src/php8/$(basename "$f")" || true
          done
          if diff -r "$committed" src/php8 \
            > "$RUNNER_TEMP/artifact/diff-committed-vs-4110d681.txt"; then
            echo "Every output at 4110d681 is byte for byte the committed file."
            echo "identical=true" >> "$GITHUB_OUTPUT"
          else
            echo "The output at 4110d681 differs from the committed files."
            head -300 "$RUNNER_TEMP/artifact/diff-committed-vs-4110d681.txt"
            echo "identical=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Move cxx to 4e023aaa and generate in place
        run: |
          set -euo pipefail
          git -C cxx fetch --depth 1 origin "$CXX_NEW"
          git -C cxx checkout --detach "$CXX_NEW"
          test "$(git -C cxx rev-parse HEAD)" = "$CXX_NEW"
          cd ip-intelligence/on-premise
          rm -rf cxx
          mkdir cxx
          cp -R ../../cxx/src cxx/src
          mkdir -p src/php8
          set -x
          "$SWIG_BIN" -c++ -php -module "$MODULE" \
            -outdir src/php8 -o src/php8/ipi_wrap.cxx ipi-php.i
          set +x
          rm -rf cxx
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/artifact/out-4e023aaa"
          cp ip-intelligence/on-premise/src/php8/* \
            "$RUNNER_TEMP/artifact/out-4e023aaa/"
          git status --porcelain --untracked-files=all \
            | tee "$RUNNER_TEMP/artifact/status-4e023aaa.txt"
          git diff --stat
          git diff -- ip-intelligence/on-premise/src/php8 \
            > "$RUNNER_TEMP/artifact/diff-committed-vs-4e023aaa.patch"
          wc -l "$RUNNER_TEMP/artifact/diff-committed-vs-4e023aaa.patch"

      - name: Upload the outputs and the diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swig-wrapper
          path: ${{ runner.temp }}/artifact
          if-no-files-found: warn

      - name: Stop unless the 4110d681 output is the committed files
        if: steps.old.outputs.identical != 'true'
        run: |
          echo "The command does not reproduce the committed wrapper."
          echo "Nothing is committed."
          exit 1

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Compile the generated wrapper against 4e023aaa
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/build/on-premise"
          mkdir -p "$RUNNER_TEMP/build"
          cp -R ip-intelligence/on-premise "$build"
          cd "$build"
          rm -rf cxx
          mkdir cxx
          cp -R "$GITHUB_WORKSPACE/cxx/src" cxx/src
          phpize
          ./configure --enable-FiftyOneDegreesIpIntelligenceEngine
          cp src/php8/* .
          make -j"$(nproc)"
          cat > "$RUNNER_TEMP/smoke.php" <<'PHP'
          <?php
          $ok = extension_loaded('FiftyOneDegreesIpIntelligenceEngine')
              && class_exists('EngineIpiSwig')
              && method_exists('EngineIpiSwig', 'process');
          echo $ok
              ? "The extension loads and EngineIpiSwig::process exists\n"
              : "The extension did not load as expected\n";
          exit($ok ? 0 : 1);
          PHP
          php -n -d extension="$build/modules/$MODULE.so" "$RUNNER_TEMP/smoke.php"

      - name: Commit the pointer and the wrapper, and push
        env:
          GIT_AUTHOR_NAME: James Rosewell
          GIT_AUTHOR_EMAIL: james@51degrees.com
          GIT_COMMITTER_NAME: James Rosewell
          GIT_COMMITTER_EMAIL: james@51degrees.com
        run: |
          set -euo pipefail
          git add cxx ip-intelligence/on-premise/src/php8
          git status --porcelain --untracked-files=all
          left="$(git status --porcelain --untracked-files=all \
            | grep -v -E '^M  cxx$' \
            | grep -v -E '^[AM]  ip-intelligence/on-premise/src/php8/[^ ]+$' \
            || true)"
          if [ -n "$left" ]; then
            echo "Changes other than the pointer and the wrapper:"
            echo "$left"
            exit 1
          fi
          git diff --cached --stat
          cat > "$RUNNER_TEMP/message.txt" <<'MSG'
          Generate the IP Intelligence SWIG wrapper again for 51degrees-cxx 4.5.101

          51degrees-cxx 4.5.101 removes the three EngineIpi process overloads
          that take required property indexes. The committed IP Intelligence
          wrapper still called all three, so the extension would not compile
          against that release.

          This moves the cxx submodule from 4110d681, the 4.5.100 release, to
          4e023aaa, the head of the 4.5.101 release pull request
          https://github.com/51Degrees/51degrees-cxx/pull/82, and generates
          ipi_wrap.cxx and php_FiftyOneDegreesIpIntelligenceEngine.h again with
          SWIG 4.5.1 built from its v4.5.1 tag. The command is the one in
          ip-intelligence/ci/build-project.ps1. Run against 4110d681 the same
          command gives files byte for byte the same as the ones committed
          before, so every difference here comes from cxx.
          MSG
          git commit -F "$RUNNER_TEMP/message.txt"
          git log -1 --format='commit %H%nauthor %an <%ae>%ncommitter %cn <%ce>%n%n%B'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
