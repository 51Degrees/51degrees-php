name: Native extensions under Valgrind

# Both on-premise extensions register SWIG's pointer classes, such as
# SWIG\_p_byte, under the same names, so the second to load replaces the
# first's. This builds both, loads them in each order, and runs
# ci/read-pointer-classes.php under Valgrind, failing on any memory error,
# so a change that leaves one extension using a class entry the other freed
# fails here.

on:
  pull_request:
    paths:
      - 'device-detection/onpremise/on-premise/**'
      - 'ip-intelligence/on-premise/**'
      - 'cxx'
      - 'ci/read-pointer-classes.php'
      - '.github/workflows/extensions-valgrind.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The check takes the free data files from the asset cache and never
  # downloads them, so this job makes sure the cache holds them first.
  # common-ci's fetch-assets looks for the day's entry that an earlier run of
  # the pull request, rc or main saved, and downloads and saves the files
  # only when there is none.
  free-data-files:
    name: Free data files in the asset cache
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.fetch.outputs.cache-key }}
    steps:
      - name: Fetch the free data files unless the cache has them
        id: fetch
        uses: 51Degrees/common-ci/actions/fetch-assets@build/fetch-assets-cache-key
        with:
          assets: |
            51Degrees-LiteV4.1.hash
            51Degrees-LiteIpiV41.ipi
          cache: true
          lazy: true

  valgrind:
    name: Both extensions in each order
    needs: free-data-files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The first job found or saved this entry, so a miss is a fault, never
      # a reason to download the files here.
      - name: Restore the free data files
        uses: actions/cache/restore@v5
        with:
          key: ${{ needs.free-data-files.outputs.key }}
          path: assets
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Check the free data files are in the cache
        run: |
          for file in 51Degrees-LiteV4.1.hash 51Degrees-LiteIpiV41.ipi; do
            if [ ! -s "assets/$file" ]; then
              echo "::error::$file is not in the asset cache entry the first" \
                "job made sure of, and this check never downloads it."
              exit 1
            fi
          done
          ls -lL assets/51Degrees-LiteV4.1.hash assets/51Degrees-LiteIpiV41.ipi

      - name: Checkout cxx
        run: git submodule update --init --depth 1 cxx

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install Valgrind
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q valgrind

      # As each package's ci/build-project.ps1 does.
      - name: Build both extensions
        run: |
          build() {
            (
              cd "$1"
              rm -rf cxx
              mkdir cxx
              cp -R "$GITHUB_WORKSPACE/cxx/src" cxx/src
              phpize
              ./configure $2
              make -j"$(nproc)"
            )
          }
          build device-detection/onpremise/on-premise ''
          build ip-intelligence/on-premise --enable-FiftyOneDegreesIpIntelligenceEngine

      # PHP's own allocator is off so that Valgrind sees every allocation,
      # and PCRE's compiled patterns are off because Valgrind cannot see into
      # them.
      - name: Run both extensions in each order
        env:
          USE_ZEND_ALLOC: '0'
          ZEND_DONT_UNLOAD_MODULES: '1'
        run: |
          dd="-d extension=$PWD/device-detection/onpremise/on-premise/modules/FiftyOneDegreesHashEngine.so
            -d FiftyOneDegreesHashEngine.data_file=$PWD/assets/51Degrees-LiteV4.1.hash"
          ipi="-d extension=$PWD/ip-intelligence/on-premise/modules/FiftyOneDegreesIpIntelligenceEngine.so
            -d FiftyOneDegreesIpIntelligenceEngine.data_file=$PWD/assets/51Degrees-LiteIpiV41.ipi"
          for order in "$dd $ipi" "$ipi $dd"; do
            valgrind --error-exitcode=1 --num-callers=30 \
              php -n -d pcre.jit=0 $order ci/read-pointer-classes.php
          done
