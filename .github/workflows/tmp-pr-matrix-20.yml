name: Temporary full build of pull request 20

on:
  push:
    branches:
      - 'tmp/pr-matrix-20'

jobs:
  Build:
    uses: 51Degrees/common-ci/.github/workflows/nightly-pull-request.yml@main
    with:
      repo-name: 51degrees-php
      org-name: 51Degrees
      pull-request-id: 20
      dryrun: 'true'
      branch: rc
      cache-assets: true
      skip-compare-performance: true
    secrets:
      token: ${{ secrets.ACCESS_TOKEN }}
      DeviceDetection: ${{ secrets.DEVICE_DETECTION_KEY }}
      DeviceDetectionUrl: ${{ secrets.DEVICE_DETECTION_URL }}
