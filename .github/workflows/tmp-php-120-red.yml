name: tmp php 120 red
# Throwaway. Installs pipeline/core with its own composer.json and runs
# WebIntegrationElementsTests on the draft's head unchanged, then with
# tmp-breaks/float-whole-number.patch, which counts a floating-point whole
# number as a sequence.
on:
  push:
    branches:
      - tmp/php-120-red
permissions:
  contents: read
jobs:
  test:
    name: red (ubuntu-24.04, PHP 8.5)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer
      - name: Install pipeline/core
        working-directory: pipeline/core
        run: composer install --no-interaction --no-progress
      - name: Run the tests unchanged and under each change
        run: |
          set +e
          summary=$GITHUB_WORKSPACE/summary.txt
          : > "$summary"
          run() {
            local change=$1
            local junit="$GITHUB_WORKSPACE/junit-$change.xml"
            echo "::group::[$change]"
            (cd pipeline/core && php vendor/bin/phpunit --colors=never --log-junit "$junit" tests/WebIntegrationElementsTests.php)
            echo "phpunit exit $?"
            echo "::endgroup::"
            php -r '$x = @simplexml_load_file($argv[1]);
              if ($x === false) { echo "RESULT [", $argv[2], "] NO JUNIT FILE", PHP_EOL; exit; }
              foreach ($x->xpath("//testcase") as $t) {
                $s = (count($t->failure) + count($t->error)) > 0 ? "FAILED" : "passed";
                echo "RESULT [", $argv[2], "] ", $t["name"], " ", $s, PHP_EOL;
              }' "$junit" "$change" | tee -a "$summary"
          }
          run unchanged
          for change in float-whole-number; do
            patch -p1 --forward --no-backup-if-mismatch < "tmp-breaks/$change.patch" || { echo "RESULT [$change] PATCH DID NOT APPLY"; exit 1; }
            run "$change"
            patch -p1 -R --no-backup-if-mismatch < "tmp-breaks/$change.patch" || exit 1
          done
          bad=0
          if grep -q '^RESULT \[unchanged\] .* FAILED' "$summary"; then echo "UNEXPECTED a test failed unchanged"; bad=1; fi
          expect() {
            if grep -q "^RESULT \[$1\] $2.* FAILED" "$summary"; then echo "EXPECTED [$1] $2 failed"; else echo "UNEXPECTED [$1] $2 did not fail"; bad=1; fi
          }
          expect float-whole-number 'testSequenceElementCountsOnlyAUsableSequence with data set "floating-point whole number"'
          echo "Failed under each change:"
          grep ' FAILED' "$summary" | grep -v '^RESULT \[unchanged\]'
          exit $bad
