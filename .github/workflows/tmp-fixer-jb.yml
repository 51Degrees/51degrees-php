name: tmp fixer jb
# Throwaway. Installs the plain PHP packages as CI does, without the native
# extensions, then runs the new tests of pipeline/core and
# device-detection/cloud, the pipeline/core Performance suite through its ci
# script, and the Unit suites of the packages the change touches.
on:
  push:
    branches:
      - tmp/fixer-jb-red
      - tmp/fixer-jb-green
permissions:
  contents: read
jobs:
  test:
    name: Test (${{ matrix.os }}, PHP ${{ matrix.php }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, php: '7.4' }
          - { os: ubuntu-latest, php: '8.1' }
          - { os: ubuntu-latest, php: '8.3' }
          - { os: ubuntu-latest, php: '8.5' }
          - { os: macos-latest, php: '8.1' }
          - { os: macos-latest, php: '8.5' }
          - { os: windows-latest, php: '8.3' }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 51Degrees/common-ci
          path: common-ci
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: common-ci/51degrees-php
          persist-credentials: false
      - name: Checkout the submodule a path repository needs
        working-directory: common-ci/51degrees-php
        run: git submodule update --init --depth 1 pipeline/did/owid-php
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: phpunit:9.6.34, composer
      - name: Install as CI does, without the native extensions
        working-directory: common-ci
        shell: pwsh
        run: |
          ./51degrees-php/ci/setup-environment.ps1 -LanguageVersion ${{ matrix.php }}
          . ./51degrees-php/ci/packages.ps1
          Install-RootComposer -RepoName 51degrees-php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-RootAutoload -RepoName 51degrees-php
      - name: New tests, pipeline/core
        id: core
        continue-on-error: true
        working-directory: common-ci/51degrees-php/pipeline/core
        shell: pwsh
        run: phpunit --fail-on-warning --testdox --testsuite Unit --filter 'JsonBundlerListTests|JavaScriptBuilderMinifyTests'
      - name: New tests, device-detection/cloud
        id: cloud
        if: always()
        continue-on-error: true
        working-directory: common-ci/51degrees-php/device-detection/cloud
        shell: pwsh
        run: phpunit --fail-on-warning --testdox --testsuite Unit --filter 'HardwareProfileCloudTest'
      - name: Performance, pipeline/core, through its ci script
        id: perf
        if: always()
        continue-on-error: true
        working-directory: common-ci
        shell: pwsh
        run: ./51degrees-php/pipeline/core/ci/run-performance-tests.ps1 -RepoName 51degrees-php/pipeline/core
      - name: Unit suites
        id: unit
        if: always()
        continue-on-error: true
        working-directory: common-ci/51degrees-php
        shell: pwsh
        run: |
          $failed = @()
          foreach ($package in 'pipeline/core', 'pipeline/engines', 'pipeline/cloudrequestengine', 'device-detection/cloud') {
            Write-Host "::group::$package Unit suite"
            Push-Location $package
            phpunit --fail-on-warning --testsuite Unit
            if ($LASTEXITCODE -ne 0) { $failed += $package }
            Pop-Location
            Write-Host "::endgroup::"
          }
          Write-Host "Unit suites failed: $($failed -join ', ')"
          exit $failed.Count
      - name: Result
        if: always()
        shell: pwsh
        run: |
          Write-Host "New tests, pipeline/core: ${{ steps.core.outcome }}"
          Write-Host "New tests, device-detection/cloud: ${{ steps.cloud.outcome }}"
          Write-Host "Performance, pipeline/core: ${{ steps.perf.outcome }}"
          Write-Host "Unit suites: ${{ steps.unit.outcome }}"
          if ('${{ steps.core.outcome }}${{ steps.cloud.outcome }}${{ steps.perf.outcome }}${{ steps.unit.outcome }}' -ne 'successsuccesssuccesssuccess') { exit 1 }
