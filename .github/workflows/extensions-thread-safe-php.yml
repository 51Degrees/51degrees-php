name: Native extensions refuse a thread-safe PHP

# Both on-premise extensions build their engine once, when PHP starts, and
# are supported only where PHP serves each request from a process forked
# after that, being Apache with the prefork MPM and mod_php, or php-fpm. A
# thread-safe (ZTS) PHP would share the engine between threads instead, so
# the build refuses one. This builds each extension against a thread-safe PHP
# and passes only when the build stops with that refusal and leaves no module.

on:
  pull_request:
    paths:
      - 'device-detection/onpremise/on-premise/**'
      - 'ip-intelligence/on-premise/**'
      - 'cxx'
      - '.github/workflows/extensions-thread-safe-php.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refuse:
    name: ${{ matrix.name }} refuses a thread-safe PHP
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Device Detection
            path: device-detection/onpremise/on-premise
            configure: ''
          - name: IP Intelligence
            path: ip-intelligence/on-premise
            configure: --enable-FiftyOneDegreesIpIntelligenceEngine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout cxx
        run: git submodule update --init --depth 1 cxx

      # setup-php takes the thread safety from the phpts environment
      # variable, not from an input.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
        env:
          phpts: ts

      - name: Check PHP is thread-safe
        run: |
          php -v
          php -r 'exit(PHP_ZTS ? 0 : 1);'

      # Prepared as each package's ci/build-project.ps1 does.
      - name: Build, expecting the refusal
        working-directory: ${{ matrix.path }}
        env:
          _51DEGREES_CONFIGURE_OPTIONS: ${{ matrix.configure }}
        run: |
          rm -rf cxx
          mkdir cxx
          cp -R "$GITHUB_WORKSPACE/cxx/src" cxx/src
          phpize
          ./configure $_51DEGREES_CONFIGURE_OPTIONS
          if make -j"$(nproc)" > make.log 2>&1; then
            tail -n 20 make.log
            echo "::error::The extension built against a thread-safe PHP."
            exit 1
          fi
          if ! grep -F "needs a non-thread-safe (NTS) PHP" make.log; then
            tail -n 40 make.log
            echo "::error::The build failed, but not with the refusal."
            exit 1
          fi
          if ls modules/*.so 2> /dev/null; then
            echo "::error::The build stopped but left a module."
            exit 1
          fi
