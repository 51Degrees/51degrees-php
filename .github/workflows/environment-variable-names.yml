name: Environment variable names

on:
  pull_request:
  push:
    branches:
      - main
      - rc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment-variable-names:
    name: No variable starting with a digit, and no old name outside the files that read one
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test the check
        shell: pwsh
        run: Invoke-Pester -Path ./ci/check-environment-variable-names.Tests.ps1 -CI

      - name: Check the names
        shell: pwsh
        run: ./ci/check-environment-variable-names.ps1

      # The CI scripts read their keys only under the _51DEGREES_ names, which
      # common-ci puts into the environment, and no old key name is left.
      - name: Test the key names the CI reads
        shell: pwsh
        run: Invoke-Pester -Path ./ci/key-names.Tests.ps1 -CI
