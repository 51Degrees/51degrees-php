name: Temporary tests
on:
  push:
    branches:
      - 'tmp/mask-green2'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, ctype, curl
      - name: Link the local packages
        run: |
          for p in core engines cloudrequestengine translation; do
            sed -i '0,/{/s//{\n    "version": "4.99.0",/' pipeline/$p/composer.json
          done
      - name: Fetch the OWID source
        run: cd pipeline/did && git submodule update --init owid-php
      - name: Run the tests
        run: |
          rc=0
          for spec in $SPECS; do
            dir=${spec%%|*}; tests=${spec#*|}
            echo "=== $dir $tests"
            cd "$GITHUB_WORKSPACE/$dir"
            for p in core engines cloudrequestengine translation; do
              composer config repositories.$p "{\"type\":\"path\",\"url\":\"$GITHUB_WORKSPACE/pipeline/$p\",\"options\":{\"symlink\":false}}" || true
            done
            composer install --no-interaction --no-progress
            vendor/bin/phpunit --testdox $tests || rc=1
          done
          exit $rc
        env:
          SPECS: "pipeline/core|tests/LicenseKeyTests.php pipeline/cloudrequestengine|tests/HttpClientFailureTests.php pipeline/did|tests/DidClientTest.php"
