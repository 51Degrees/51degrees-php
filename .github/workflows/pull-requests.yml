name: Pull Requests

on:
  workflow_dispatch:
    inputs:
      dryrun:
        type: boolean
        default: false
      prs:
        description: 'Comma-separated pull request numbers to build, drafts included'
        type: string
        default: ''
      full-matrix:
        description: 'Build every configuration, not only those the changes need'
        type: boolean
        default: false

jobs:
  PullRequests:
    name: Pull Requests
    uses: 51Degrees/common-ci/.github/workflows/nightly-pull-requests.yml@main
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun || false }}
      prs: ${{ inputs.prs }}
      cache-assets: true
      # The on-premise packages compile native extensions and load
      # multi-gigabyte data files, and every package runs in each leg.
      build-test-timeout-minutes: 300
      # Each pull request is built on the configurations its changes need,
      # as ci/select-options.ps1 chooses, and one that fails does not cancel
      # the others. With nothing eligible, the nightly builds rc instead.
      full-matrix: ${{ inputs.full-matrix || false }}
      fail-fast: false
      build-without-pull-requests: false
    secrets: inherit
