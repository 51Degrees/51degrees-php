# Publishes the release of pipeline-php-did (51degrees/fiftyone.pipeline.did)
# for each version tag of this repository.
#
# The package cannot be released as the plain split that mirror.yml tags for
# the other packages. main keeps the OWID library as a git submodule and
# consumes it through a Composer "path" repository, and neither survives
# publication, because Packagist serves GitHub's archive of the tag and a git
# archive writes a submodule as an empty directory. This workflow assembles
# the tree that is published, so the OWID source exists in published tags and
# never on main.
#
# Packagist reads the pipeline-php-did mirror, not this repository. The
# published commit holds the assembled package and nothing else, and its
# parent is the git subtree split of pipeline/did/ at the tagged commit,
# which is the commit mirror.yml puts on the mirror's main. So the mirror
# shows the release on top of the source it came from.
#
# The version is the repository's, chosen by common-ci when it publishes, so
# this package is released with every other package under the same number.
# common-ci refuses a version that moves the major or minor place before it
# tags, so that check is not repeated here.
#
# Run it by hand to rehearse: it assembles and checks the package from the
# chosen branch, pushes nothing, and keeps the assembled package as an
# artifact of the run.

name: Publish pipeline-php-did

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse, for example 4.5.203. Nothing is pushed.'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: did-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_DIR: pipeline/did
  # The old repository that Packagist reads, which is not the directory name.
  MIRROR_REPO: pipeline-php-did

jobs:
  Publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Read the version and whether this is a dry run
        id: release
        # The dispatch input is read through the environment rather than
        # written into the script, because anything written into the script
        # becomes part of the script and a person with write access could
        # put commands there.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="$GITHUB_REF_NAME"
            dryrun=false
          else
            version="$INPUT_VERSION"
            dryrun=true
          fi
          pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$version" =~ $pattern ]]; then
            echo "'$version' is not a version such as 4.5.203" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dryrun=$dryrun" >> "$GITHUB_OUTPUT"
          echo "Publishing $version, dry run $dryrun"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git subtree split walks the whole history.
          fetch-depth: 0
          # The GITHUB_TOKEN header the checkout would leave behind is sent
          # to every github.com URL and would replace MIRROR_PUSH_TOKEN on
          # the mirror push.
          persist-credentials: false

      # Only this package's submodule. The others are large (the C
      # libraries and the data files) and the package does not use them.
      - name: Checkout the OWID submodule
        run: git submodule update --init "$PACKAGE_DIR/owid-php"

      # The same guards as mirror.yml, for a tag pushed by hand.
      - name: Refuse a tag that is not on main or is below the mirror
        if: steps.release.outputs.dryrun != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "$MIRROR_PUSH_TOKEN" ]; then
            echo "::error::Secret MIRROR_PUSH_TOKEN is not set"
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::tag $VERSION is not on main"
            exit 1
          }
          mirror="https://x-access-token:${MIRROR_PUSH_TOKEN}@github.com/${OWNER}/${MIRROR_REPO}.git"
          pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
          top=$(git ls-remote --tags "$mirror" | awk '{ print $2 }' |
            sed -e 's|^refs/tags/||' -e 's|\^{}$||' | { grep -E "$pattern" || true; } | sort -V | tail -1)
          if [ -n "$top" ] && [ "$(printf '%s\n' "$top" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::$VERSION is below $top, the highest version on $MIRROR_REPO"
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, openssl, json

      - name: Assemble the package
        run: '"$PACKAGE_DIR/ci/assemble-package.sh" "$RUNNER_TEMP/package"'

      - name: Check the package the way a consumer sees it
        run: |
          set -euo pipefail
          # Check a copy, so the files installed and generated by the
          # check stay out of the tree that is published.
          rm -rf "$RUNNER_TEMP/verify"
          cp -R "$RUNNER_TEMP/package" "$RUNNER_TEMP/verify"
          cd "$RUNNER_TEMP/verify"
          composer validate --strict
          # A consumer has no path repository, so this resolves only if
          # every requirement is on Packagist or built into PHP.
          composer install --no-dev --no-interaction --no-progress
          # Builds and parses a 51Did using nothing but the package, so
          # it fails if the copied OWID source is missing or unreachable.
          php examples/fodid_example.php
          composer install --no-interaction --no-progress
          php vendor/phpunit/phpunit/phpunit --testsuite Unit

      - name: Build the published commit and tag
        id: build
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          source_commit="$(git rev-parse HEAD)"
          # Keeps the split inside the package history, see the script.
          ./ci/prepare-split.sh
          split="$(git subtree split --prefix="$PACKAGE_DIR" 2>"$RUNNER_TEMP/split.err")" || {
            cat "$RUNNER_TEMP/split.err" >&2
            exit 1
          }
          git config user.name 'Automation51D'
          git config user.email '51DCI@51Degrees.com'
          # A separate index over the assembled package, so the published
          # commit holds the package and nothing else while keeping the
          # split commit as its parent for provenance. The checkout itself
          # is left alone.
          export GIT_INDEX_FILE="$RUNNER_TEMP/release.index"
          rm -f "$GIT_INDEX_FILE"
          git --work-tree="$RUNNER_TEMP/package" add -A -f .
          tree="$(git write-tree)"
          unset GIT_INDEX_FILE
          commit="$(git commit-tree "$tree" -p "$split" \
            -m "Release $version" \
            -m "Assembled from $split ($PACKAGE_DIR/ at $source_commit) with the OWID source copied in.")"
          # The tag is made here, in the checkout, only so the archive check
          # below reads exactly what is pushed. This repository's own tag
          # of the same name was made by common-ci and is not touched.
          git tag -f -a "$version" -m "Release $version" "$commit"
          git show --stat --oneline "$commit"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Check that the published tag archives with the OWID source
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          # Packagist serves this archive, so this is the check the whole
          # workflow exists for.
          git archive --format=tar "$version" > "$RUNNER_TEMP/published.tar"
          tar -tf "$RUNNER_TEMP/published.tar" | sort \
            > "$RUNNER_TEMP/published.txt"
          cat "$RUNNER_TEMP/published.txt"
          grep -q 'third-party/swan-community/owid/src/Owid.php' \
            "$RUNNER_TEMP/published.txt" || {
              echo "the archive of $version carries no OWID source" >&2
              exit 1
            }

      # A published version is never replaced. The assembled commit differs
      # on every run because it carries the time it was made, so a re-run is
      # let through when the mirror's tag holds the same tree.
      - name: Push the published tag to the mirror
        if: steps.release.outputs.dryrun != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TREE: ${{ steps.build.outputs.tree }}
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          mirror="https://x-access-token:${MIRROR_PUSH_TOKEN}@github.com/${OWNER}/${MIRROR_REPO}.git"
          if git ls-remote --exit-code --tags "$mirror" "refs/tags/$VERSION" > /dev/null; then
            git fetch --no-tags "$mirror" "refs/tags/$VERSION"
            published="$(git rev-parse 'FETCH_HEAD^{tree}')"
            if [ "$published" = "$TREE" ]; then
              echo "$MIRROR_REPO already has $VERSION with this tree"
              exit 0
            fi
            echo "::error::$MIRROR_REPO already has $VERSION with tree $published, not $TREE. A published version is never moved."
            exit 1
          fi
          git push "$mirror" "refs/tags/$VERSION"

      - name: Keep the assembled package from a dry run
        if: steps.release.outputs.dryrun == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ steps.release.outputs.version }}
          path: ${{ runner.temp }}/package
