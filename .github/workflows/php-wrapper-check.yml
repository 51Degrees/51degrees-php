name: PHP wrapper check

on:
  pull_request:
    paths:
      - 'device-detection/onpremise/on-premise/**'
      - 'ip-intelligence/on-premise/**'
      - 'cxx'
      - '.github/workflows/php-wrapper-check.yml'
  push:
    branches:
      - main
      - rc
  workflow_dispatch:

permissions:
  contents: read

env:
  SWIG_VERSION: 4.5.1

jobs:
  device-detection-wrapper:
    name: Device Detection wrapper matches hash-php.i
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout cxx
        run: git submodule update --init cxx

      - name: Restore SWIG
        id: swig-cache
        uses: actions/cache@v4
        with:
          path: ~/swig
          key: swig-${{ env.SWIG_VERSION }}-${{ runner.os }}

      - name: Build SWIG ${{ env.SWIG_VERSION }}
        if: steps.swig-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y bison autoconf automake libpcre2-dev
          git clone --depth 1 --branch "v${SWIG_VERSION}" \
            https://github.com/swig/swig.git swig-src
          cd swig-src
          ./autogen.sh
          ./configure --prefix="$HOME/swig"
          make -j"$(nproc)"
          make install

      - name: Check the committed wrapper
        run: |
          export PATH="$HOME/swig/bin:$PATH"
          swig -version
          sh device-detection/onpremise/on-premise/generate-wrapper.sh --check

  ip-intelligence-wrapper:
    name: IP Intelligence wrapper matches ipi-php.i
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout cxx
        run: git submodule update --init cxx

      - name: Restore SWIG
        id: swig-cache
        uses: actions/cache@v4
        with:
          path: ~/swig
          key: swig-${{ env.SWIG_VERSION }}-${{ runner.os }}

      - name: Build SWIG ${{ env.SWIG_VERSION }}
        if: steps.swig-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y bison autoconf automake libpcre2-dev
          git clone --depth 1 --branch "v${SWIG_VERSION}" \
            https://github.com/swig/swig.git swig-src
          cd swig-src
          ./autogen.sh
          ./configure --prefix="$HOME/swig"
          make -j"$(nproc)"
          make install

      - name: Check the committed wrapper
        run: |
          export PATH="$HOME/swig/bin:$PATH"
          swig -version
          sh ip-intelligence/on-premise/generate-wrapper.sh --check
