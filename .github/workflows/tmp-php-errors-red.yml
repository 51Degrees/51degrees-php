name: tmp php errors red
# Throwaway. Runs the Unit suites of pipeline/core and
# pipeline/translation on the draft's head, then the new tests with
# FlowData.php as it is on rc 33eaae22.
on:
  push:
    branches:
      - tmp/php-errors-red
permissions:
  contents: read
jobs:
  red:
    name: red (ubuntu-24.04, PHP 8.5)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout submodules
        run: git submodule update --init --depth 1 pipeline/did/owid-php derived-properties javascript-templates
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer
      - name: Install the root composer.json
        run: composer install --no-interaction --no-progress
      - name: Head, then rc's FlowData.php
        run: |
          set +e
          mkdir -p junit
          packages="pipeline/core pipeline/translation"
          for package in $packages; do
            mkdir -p "$package/vendor"
            printf '%s\n' '<?php' "return require __DIR__ . '/../../../vendor/autoload.php';" > "$package/vendor/autoload.php"
          done
          run() {
            name=$1; shift
            for package in $packages; do
              out="$GITHUB_WORKSPACE/junit/$name-$(echo $package | tr / -).xml"
              echo "::group::$name $package"
              (cd "$package" && ../../vendor/bin/phpunit --colors=never --bootstrap ../../vendor/autoload.php --testsuite Unit --log-junit "$out" "$@")
              echo "exit $? for $name $package"
              echo "::endgroup::"
            done
          }
          NEW='testOneErrorUnderAKeyIsKeptAsItIs|testEveryErrorUnderAKeyIsKeptInOrder|testErrorsUnderOtherKeysAreKeptApart|testEveryMissingTranslationOfOneEngineIsKept|testEveryMissingTranslationOfEnginesSharingAKeyIsKept'
          run head
          git fetch -q --depth 1 origin 33eaae22ea9f9d119ea0f4f4069c0f5a241af6a9
          git checkout FETCH_HEAD -- pipeline/core/src/FlowData.php
          run rc-source --filter "$NEW"
          exit 0
      - name: Each test's result
        shell: python
        run: |
          import glob, xml.etree.ElementTree as ET
          def results(name):
              out = {}
              for f in glob.glob(f'junit/{name}-*.xml'):
                  for case in ET.parse(f).getroot().iter('testcase'):
                      failed = case.find('failure') is not None or case.find('error') is not None
                      out[case.get('name')] = 'fail' if failed else 'pass'
              return out
          head, rc = results('head'), results('rc-source')
          bad = {k: v for k, v in head.items() if v != 'pass'}
          print(f'head: {len(head)} tests, {sum(v == "pass" for v in head.values())} passed, not passed: {bad}')
          want = {'testEveryErrorUnderAKeyIsKeptInOrder': 'fail', 'testEveryMissingTranslationOfOneEngineIsKept': 'fail', 'testEveryMissingTranslationOfEnginesSharingAKeyIsKept': 'fail', 'testOneErrorUnderAKeyIsKeptAsItIs': 'pass', 'testErrorsUnderOtherKeysAreKeptApart': 'pass'}
          ok = not bad
          for t, outcome in want.items():
              print(f'{t}: head {head.get(t)}, rc FlowData.php {rc.get(t)} (expected {outcome})')
              ok = ok and head.get(t) == 'pass' and rc.get(t) == outcome
          print('RESULT', 'as expected' if ok else 'NOT as expected')
          raise SystemExit(0 if ok else 1)
