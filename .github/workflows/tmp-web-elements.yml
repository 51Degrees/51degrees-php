name: Temporary cloud request engine tests
on:
  push:
    branches:
      - 'tmp/lko-java**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test
        run: ./mvnw -B -ntp -pl pipeline/pipeline.cloudrequestengine -am test -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false
